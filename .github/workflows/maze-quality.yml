name: Labyrinthe - tests des parcours
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the final 28 collectible paintings
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 scripts/build-collectible-atlas.py
      - name: Validate game script and all maze levels
        run: node tests/maze-shapes.cjs
      - name: Publish generated atlas to experimental branch if missing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git cat-file -e HEAD:assets/collectibles/atlas-3.webp 2>/dev/null; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/collectibles/atlas-3.webp
          git commit -m "V4.7: generated 28 illustrated collectible assets"
          git push origin HEAD:refs/heads/${{ github.head_ref }}
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the final 28 collectible paintings
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 scripts/build-collectible-atlas.py
      - name: Install browser test harness
        run: npm install --no-save playwright-core@1.56.0
      - name: Test album and maze on phone and tablet
        run: node tests/browser-smoke.cjs
      - name: Keep QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labyrinthe-v47-screens
          path: qa-screens/
          if-no-files-found: ignore
