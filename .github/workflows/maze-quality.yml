name: Labyrinthe - tests des parcours
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the final 28 collectible paintings
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 scripts/build-collectible-atlas.py
      - name: Validate game script and all maze levels
        run: node tests/maze-shapes.cjs
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the final 28 collectible paintings
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 scripts/build-collectible-atlas.py
      - name: Install browser test harness
        run: npm install --no-save playwright-core@1.56.0
      - name: Test album and maze on phone and tablet
        run: node tests/browser-smoke.cjs
      - name: Keep QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labyrinthe-v47-screens
          path: qa-screens/
          if-no-files-found: ignore
