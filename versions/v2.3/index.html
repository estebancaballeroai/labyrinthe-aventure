 if(t==='D'&&rr.key||t==='G'&&rr.switchOn){c.fillStyle=rr.cfg.world===2?'#a8b5da':rr.cfg.world===1?'#dbc496':'#a9d39c';c.fillRect(0,0,tileSize,tileSize);c.fillStyle='#3f806d';c.fillRect(tileSize*.28,tileSize*.7,tileSize*.44,tileSize*.06);}
 c.restore();}
 var gp=guardAt(rr,rr.steps);if(gp&&(rr.cfg.type!=='fog'||rr.seen[key(gp[0],gp[1])])&&gp[0]>=ox&&gp[0]<ox+dim&&gp[1]>=oy&&gp[1]<oy+dim)emoji(c,'👻',(gp[0]-ox+.5)*tileSize,(gp[1]-oy+.5)*tileSize,tileSize*.74);
 if(rr.x>=ox&&rr.y>=oy&&rr.x<ox+dim&&rr.y<oy+dim)drawHero(c,(rr.x-ox)*tileSize,(rr.y-oy)*tileSize,tileSize);
 if(mapShown){rrRect(c,sz*.28,6,sz*.44,25,12,'#123e49dc');c.fillStyle='#fff9e5';c.font='bold 12px sans-serif';c.textAlign='center';c.fillText('CARTE GÉNÉRALE',sz*.5,23);}else if(n>9){rrRect(c,sz-85,8,77,24,10,'#183e48b9');c.fillStyle='#f5f6e3';c.font='bold 11px sans-serif';c.textAlign='center';c.fillText('🧭 '+(rr.x+1)+','+(rr.y+1),sz-47,24);}}
function generatedEndless(){var diff=Number(document.getElementById('diff').value),biome=Number(document.getElementById('biome').value),type=document.getElementById('rules').value;var seed=Math.floor(Math.random()*2000000000)+1;return{id:'e'+seed,idx:0,title:'Expédition surprise',type:type,size:diff,seed:seed,world:biome,desc:'Un labyrinthe différent à chaque partie.',mode:'endless'};}
function handleAction(target){while(target&&target!==document){if(target.getAttribute&&target.getAttribute('data-action'))break;target=target.parentNode;}if(!target||target===document)return;var action=target.getAttribute('data-action');
 if(action==='sound'){progress.sound=!progress.sound;persist();render();if(progress.sound)playSound(660);return;}

 if(action==='avatar'){progress.avatar=target.getAttribute('data-avatar');persist();render();return;}
 if(action==='grade'){progress.grade=target.getAttribute('data-grade')==='CM1'?'CM1':'CE2';persist();render();return;}

 if(action==='tab'){tab=target.getAttribute('data-tab');render();return;}
 if(action==='home'||action==='leave'){if(run&&modal!=='win')progress.lastRun=packRun(run);screen='home';modal=null;run=null;persist();render();window.scrollTo(0,0);return;}
 if(action==='world'){selectedWorld=Number(target.getAttribute('data-world'));if(!worldUnlocked(selectedWorld)){feedback='Termine d’abord le monde précédent.';return;}screen='world';render();window.scrollTo(0,0);return;}
 if(action==='level'){var cfg=findCfg(target.getAttribute('data-id'));if(cfg&&(cfg.mode!=='campaign'||levelUnlocked(cfg.idx)))start(cfg);return;}
 if(action==='collection'){modal='collection';render();return;}
 if(action==='chapters'){screen='chapters';modal=null;run=null;render();return;}
 if(action==='chapter'){var cc=CHAPTERS.find(function(c){return c.id===target.getAttribute('data-id');});if(cc&&(cc.idx===0||progress.done[CHAPTERS[cc.idx-1].id]))start(cc);return;}
 if(action==='pilot'){start({id:'pilot-v11',idx:0,title:'Le Pont aux trois chemins',type:'exit',size:21,seed:61731,world:0,mode:'pilot',desc:'Trois chemins, des trésors cachés et une sortie.',branching:true});return;}
 if(action==='route'){if(!run||!run.map.branches)return;var i=Math.max(0,Math.min(2,Number(target.getAttribute('data-route')))),p=run.map.branches.points[i];if(p){run.x=p[0];run.y=p[1];run.chosenRoute=i;progress.routes[run.cfg.id]=i;reveal(run);feedback='🧭 Tu explores un nouveau chemin !';}modal=null;persist();render();return;}
 if(action==='quickstart'){var i=0;while(i<CAMPAIGN.length-1&&progress.done[CAMPAIGN[i].id])i++;start(CAMPAIGN[i]);return;}
 if(action==='endless'){start(generatedEndless());return;}
 if(action==='resume'){resume();return;}
 if(action==='pause'){modal='pause';render();return;}
 if(action==='hint'){modal='hint';render();return;}
 if(action==='map'){mapShown=!mapShown;feedback=mapShown?'🗺️ Carte générale affichée. Appuie encore pour revenir.':'🧭 Retour à ton explorateur.';updateGame();return;}
 if(action==='closemodal'){modal=null;wrongAnswer=false;render();return;}
 if(action==='move'){step(Number(target.getAttribute('data-dx')),Number(target.getAttribute('data-dy')));return;}
 if(action==='wait'){waitTurn();return;}
 if(action==='restart'){var cfg2=run&&run.cfg;if(cfg2)start(cfg2);return;}
 if(action==='next'){nextLevel();return;}
 if(action==='bookopen'){if(!run)return;var b=bookAt(run,run.x,run.y);if(b&&!run.booksDone[key(run.x,run.y)])openBook(run,b);else{feedback='📖 Place-toi sur une case contenant un livre de couleur.';updateGame();}return;}
 if(action==='bookskip'){if(run&&run.currentBook)run.booksSkipped[run.currentBook]=true;modal=null;persist();render();return;}
 if(action==='answer'){if(!run||modal!=='book')return;var q=currentQuiz(run);if(!q)return;var pos=run.currentBook;if(run.booksDone[pos])return;var good=Number(target.getAttribute('data-answer'))===q.ok;run.booksDone[pos]={correct:good,id:q.id};progress.booksRead=(progress.booksRead||0)+1;if(good)progress.booksCorrect=(progress.booksCorrect||0)+1;progress.quizHistory[q.id]=(progress.quizHistory[q.id]||0)+1;progress.coins+=good?5:2;run.lastBookResult={correct:good};modal='bookresult';playSound(good?880:330);persist();render();return;}


}
document.addEventListener('click',function(e){if(e.target&&e.target.id==='gameCanvas'){if(Date.now()-lastSwipe<400)return;var canvas=e.target,bounds=canvas.getBoundingClientRect(),cx=(e.clientX-bounds.left)/bounds.width,cy=(e.clientY-bounds.top)/bounds.height;var dx=cx-.5,dy=cy-.5;if(Math.abs(dx)>Math.abs(dy))step(dx>0?1:-1,0);else step(0,dy>0?1:-1);return;}handleAction(e.target);});
document.addEventListener('keydown',function(e){if(screen!=='game'||modal)return;var k=e.key;var v={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],z:[0,-1],q:[-1,0]};if(v[k]){e.preventDefault();step(v[k][0],v[k][1]);}else if(k===' '){e.preventDefault();waitTurn();}else if(k==='Escape'){e.preventDefault();modal='pause';render();}});
var touch=null;document.addEventListener('touchstart',function(e){if(screen!=='game'||modal||e.target.id!=='gameCanvas')return;var t=e.changedTouches[0];touch=[t.clientX,t.clientY];},{passive:true});document.addEventListener('touchend',function(e){if(!touch||screen!=='game'||modal)return;var t=e.changedTouches[0],dx=t.clientX-touch[0],dy=t.clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;lastSwipe=Date.now();e.preventDefault();if(Math.abs(dx)>Math.abs(dy))step(dx>0?1:-1,0);else step(0,dy>0?1:-1);},{passive:false});
window.addEventListener('resize',function(){if(screen==='game')paint();});

window.LabyrintheTest={generate:generate,makeRun:makeRun,bfs:bfs,trace:trace,campaign:CAMPAIGN,academy:ACADEMY,quizzes:QUIZZES,subjects:SUBJECTS,avatars:AVATARS,openBook:openBook,bookAt:bookAt,selectBookQuestion:selectBookQuestion,validExit:playerCanExit,step:step,getRun:function(){return run;},getScreen:function(){return screen;},getProgress:function(){return progress;},chapters:CHAPTERS,start:start,getModal:function(){return modal;},getArtReady:function(){return ART_READY;},packRun:packRun,unpackRun:unpackRun};
render();
